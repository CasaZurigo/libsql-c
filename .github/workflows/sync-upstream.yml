name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "casa-zurigo-ci"
          git config user.email "ci@casazuri.ch"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --tags --force
          git merge upstream/main --no-edit
          git push origin main
        env:
          UPSTREAM_URL: ${{ vars.UPSTREAM_URL }}

      - name: Open an issue on merge conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream merge conflict (${new Date().toISOString().slice(0, 10)})`,
              body: "The weekly upstream merge failed. Resolve the conflict on `main` manually, then re-run this workflow.",
            })
